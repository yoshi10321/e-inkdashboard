#
# Kindle ダッシュボード画像の自動生成
#
# リポジトリ内の index.html を 1 時間おきにスクリーンショットし、
# Kindle 向けの PNG に変換して GitHub Pages に公開する。
#
# 公開されるもの:
#   https://yoshi10321.github.io/e-inkdashboard/           … ダッシュボード本体（ブラウザ用）
#   https://yoshi10321.github.io/e-inkdashboard/dash.png      … Kindle 用（1072x1448・反時計回りに90度回転済み）
#   https://yoshi10321.github.io/e-inkdashboard/dash-land.png … 確認用（1448x1072・回転なし）
#   https://yoshi10321.github.io/e-inkdashboard/bat/NN.png    … バッテリー表示（5%刻み・回転済み）
#
# 反時計回りに回すことで、ダッシュボードの「右上」が端末の左上(0,0)に来る。
# eips は画像を左上に描くため、そこにバッテリー画像を重ねると
# 横向き設置したときの「画面上部」に正しい向きで表示できる。
#
# ---------------------------------------------------------------------------
# 事前にやること（初回のみ）
#   リポジトリ設定 → Pages → Source を「GitHub Actions」にする
# ---------------------------------------------------------------------------

name: Render Kindle Dashboard

on:
  push:
    branches: [main]        # index.html を直せば自動で作り直す
  schedule:
    # GitHub のスケジュール実行はベストエフォートで、毎時 0 分前後は
    # 負荷が高く遅延・間引きされる。実際 '5 * * * *' では 3〜8 時間
    # 空くことがあった。混雑帯を外した半端な分に置き、
    # 30 分おきにして取りこぼしに備える。
    - cron: '7,37 * * * *'
    # 日付が変わった直後にもう一度。GitHub の cron は UTC なので
    # 15:19 UTC = 翌 00:19 JST。
    - cron: '19 15 * * *'
  workflow_dispatch:        # 手動実行も可能にする

# GitHub Pages への公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 実行が重なった場合は新しい方を優先し、古い方は止める
concurrency:
  group: kindle-dashboard
  cancel-in-progress: true

env:
  # ブラウザの描画ビューポート（横長）。CSS はこの寸法前提で組んである。
  VIEWPORT_WIDTH: '1024'
  VIEWPORT_HEIGHT: '758'

  # 出力する画像のサイズ（回転前・横長）。
  # Kindle Paperwhite 3（第7世代・300ppi）の画面は 1072 x 1448 なので、
  # 横長 1448 x 1072 で書き出してから 90 度回して 1072 x 1448 にする。
  # 1448:1072 は 1024:758 とほぼ同じ縦横比なので、レイアウトは崩れない。
  OUT_WIDTH: '1448'
  OUT_HEIGHT: '1072'

  # バッテリー表示画像のサイズ（回転前・横長）。
  # ダッシュボード側でこのぶんの余白を右上に空けてある。
  BAT_WIDTH: '90'
  BAT_HEIGHT: '40'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 日本語フォントと ImageMagick を入れる
        # ・fonts-noto-cjk : ランナーには日本語フォントが無く、入れないと本文が豆腐（□）になる
        # ・imagemagick    : 画像の回転とグレースケール化に使う。ランナーに標準では入っていない
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra imagemagick

          # Noto Sans CJK は JP/SC/TC/KR が同じファミリー名を共有していて、
          # 英語ロケールの環境では既定で SC（簡体字）の字形が選ばれる。
          # 名前を指定せずフォールバックした場合も日本語が出るようにしておく。
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'FC'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test name="family"><string>sans-serif</string></test>
              <edit name="family" mode="prepend" binding="strong">
                <string>Noto Sans CJK JP</string>
              </edit>
            </match>
            <match target="pattern">
              <test name="family"><string>serif</string></test>
              <edit name="family" mode="prepend" binding="strong">
                <string>Noto Serif CJK JP</string>
              </edit>
            </match>
          </fontconfig>
          FC
          fc-cache -f >/dev/null
          echo "sans-serif の既定: $(fc-match 'sans-serif:lang=ja')"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright と Chromium を入れる
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit playwright
          npx playwright install --with-deps chromium

      - name: 表示するデータを取得する
        # ブラウザから直接 API を叩くと CORS や相手側の制限で失敗することがあるため、
        # ここ（サーバー側）でまとめて取得して data.json に書き出す。
        # 一部が取れなくてもワークフローは止めない。
        run: python3 fetch_data.py

      - name: ローカルサーバーを起動
        # file:// で開くと一部ブラウザ機能の扱いが変わるため、
        # 実際の配信と同じ http:// で読み込ませる。
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ >/dev/null && break
            sleep 0.5
          done
          echo "ローカルサーバー起動 OK"

      - name: ページをスクリーンショット
        run: |
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';

          // #flat を付けると CSS の 90 度回転が無効になり、横長のまま描画される。
          // 回転は後段の ImageMagick でまとめて行う。
          const url    = 'http://127.0.0.1:8000/#flat';
          const width  = Number(process.env.VIEWPORT_WIDTH);
          const height = Number(process.env.VIEWPORT_HEIGHT);

          // 最終出力と同じ画素数で描かせる。
          //
          // 以前は 2 倍で撮ってから 0.707 倍に縮めていたが、半端な縮小のせいで
          // 文字のふちに中間調の灰色が大量に生まれ、E-ink 側でそれが点々に
          // 散って（ディザ）ガビガビに見えていた。
          // 1024 x 1.4140625 = 1448 ちょうど。ブラウザにこの倍率で描かせれば
          // 縮小処理そのものが要らなくなり、文字が最初から最終解像度で整う。
          const scale = Number(process.env.OUT_WIDTH) / width;

          const browser = await chromium.launch();
          const page = await browser.newPage({
            viewport: { width, height },
            deviceScaleFactor: scale,
            // ランナーの時計は UTC。日本時間で描かせないと
            // 0時〜9時のあいだ日付が 1日前になる。
            timezoneId: 'Asia/Tokyo',
            locale: 'ja-JP',
          });
          console.log('描画倍率:', scale, '→', Math.round(width * scale) + 'x' + Math.round(height * scale));

          console.log('開く:', url);
          await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });

          // 天気・為替・日経の取得が終わるのを待つ。
          // 「--」のままの枠が無くなるか、最長 30 秒で打ち切る。
          await page.waitForFunction(() => {
            const ids = ['wxTemp', 'fxValue', 'nkValue'];
            return ids.every(function (id) {
              const node = document.getElementById(id);
              return node && node.textContent.indexOf('--') === -1;
            });
          }, null, { timeout: 30000 }).catch(function () {
            console.log('一部のデータが取得できませんでした。そのまま撮影します。');
          });

          // 日本語の字形が本当に日本語のフォントで描かれているか確かめる。
          // Noto Sans CJK は JP/SC/TC/KR が同名なので、実際に使われた
          // フォント名を Chrome DevTools Protocol から取って残しておく。
          try {
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('DOM.enable');
            await cdp.send('CSS.enable');
            const { root } = await cdp.send('DOM.getDocument');
            const { nodeId } = await cdp.send('DOM.querySelector',
              { nodeId: root.nodeId, selector: '.wx-desc' });
            const { fonts } = await cdp.send('CSS.getPlatformFontsForNode', { nodeId });
            const used = fonts.map(f => `${f.familyName}(${f.glyphCount})`).join(', ');
            console.log('日本語に使われたフォント: ' + used);
            if (/\bSC\b|\bTC\b|\bKR\b|WenQuanYi|Heiti|Song/.test(used)) {
              console.log('::warning::日本語以外の字形が使われています: ' + used);
            } else {
              console.log('::notice::日本語のフォント: ' + used);
            }
          } catch (e) {
            console.log('フォントの確認に失敗（撮影は続行）: ' + e.message);
          }

          await page.waitForTimeout(1500);   // 描画の落ち着きを待つ
          await page.screenshot({ path: 'raw.png' });

          // 画面に「取得できませんでした」が残っていないか確認する。
          // 残っていてもワークフローは止めない（前回の画像より新しい方がましなので）が、
          // ログに警告として出し、気づけるようにしておく。
          const bad = await page.evaluate(() => {
            const t = document.body.innerText;
            return ['取得できませんでした', '取得失敗'].filter(s => t.indexOf(s) !== -1);
          });
          if (bad.length) {
            console.log('::warning::画面に取得失敗の表示が残っています: ' + bad.join(', '));
          } else {
            console.log('データの表示を確認した（取得失敗の表示なし）');
          }

          await browser.close();
          console.log('撮影完了');
          EOF
          node shot.mjs

      - name: Kindle 向けの PNG に変換
        # ・撮影時点ですでに出力サイズなので、拡大縮小はしない（1px のずれだけ整える）
        # ・反時計回りに 90 度回転して 1072 x 1448 の縦長にする
        # ・グレースケール 8bit にする（E-ink に合わせ、ファイルも軽くなる）
        # ・階調を 16 段に落とす。Paperwhite の画面は 16 階調しか出せないので、
        #   中途半端な灰色を端末側にディザ（点々）で近似させるより、
        #   こちらで素直に丸めた方が文字のふちが締まる。
        run: |
          set -e
          mkdir -p public

          # ImageMagick 7 は magick、6 は convert。どちらでも動くようにする。
          IM="$(command -v magick || command -v convert)"
          # ImageMagick 6 の convert は副コマンドを解さないので、identify は別に持つ
          if command -v identify >/dev/null; then
            ID="identify"
          else
            ID="magick identify"
          fi
          echo "ImageMagick: $IM / $ID"
          "$IM" -version | head -n 1
          echo "撮影されたサイズ: $($ID -format '%wx%h' raw.png)"

          # eips が読めるのは 8bit グレースケールの PNG だけ。
          # -posterize で階調を減らすと ImageMagick が勝手に 4bit 深度へ落とし、
          # 端末では真っ白になる。png:bit-depth と png:color-type で固定する。
          PNGOPT="-define png:bit-depth=8 -define png:color-type=0"

          "$IM" raw.png \
            -resize ${OUT_WIDTH}x${OUT_HEIGHT}! \
            -colorspace Gray \
            -type Grayscale \
            +dither -posterize 16 \
            -depth 8 \
            -strip $PNGOPT \
            public/dash-land.png

          # 端末は縦向きのままなので、横向きに置いて読めるよう回しておく。
          "$IM" public/dash-land.png -rotate -90 -strip $PNGOPT public/dash.png

          # 書き出した PNG が本当に 8bit グレースケールか確かめる。
          # ここを間違えると端末が真っ白になり、原因が分かりにくい。
          for f in public/dash.png public/dash-land.png; do
            info=$($ID -format '%[depth] %[channels] %wx%h' "$f")
            echo "$f -> $info"
            case "$info" in
              "8 gray"*) : ;;
              *) echo "::error::$f が 8bit グレースケールではありません ($info)"; exit 1 ;;
            esac
          done

          # 残像消し用の真っ黒な画像。
          # E-ink は一度黒く塗ってから白に戻すと前の絵が完全に抜ける。
          # eips -f が効かない端末でも、これを挟めば同じことができる。
          "$IM" -size ${OUT_HEIGHT}x${OUT_WIDTH} xc:black \
            -colorspace Gray -type Grayscale -depth 8 \
            -strip $PNGOPT public/black.png

          # ダッシュボード本体と取得済みデータも公開する
          # （ブラウザから見るときも同じデータが使われる）
          cp index.html public/index.html
          cp data.json  public/data.json

          # --- バッテリー表示用の小さな画像を 5% 刻みで作る ---
          # Kindle 標準のような電池アイコン（枠＋残量ぶんの塗り＋右の突起）を描く。
          # 横向きに作ってから本体と同じ向き（反時計回り90度）に回すので、
          # 端末の左上に重ねて描くとダッシュボードの右上に正しい向きで出る。
          mkdir -p public/bat
          for lv in $(seq 0 5 100); do
            # 枠の内側 8〜71px を残量で塗りつぶす
            fill_r=$(( 8 + 63 * lv / 100 ))
            [ "$fill_r" -le 8 ] && fill_r=8
            "$IM" -size ${BAT_WIDTH}x${BAT_HEIGHT} xc:white \
              -stroke black -strokewidth 3 -fill white \
              -draw "roundrectangle 4,7 75,33 3,3" \
              -stroke none -fill black \
              -draw "rectangle 77,15 85,25" \
              -draw "rectangle 8,11 ${fill_r},29" \
              -rotate -90 \
              -colorspace Gray -type Grayscale -depth 8 -strip $PNGOPT \
              "public/bat/${lv}.png"
          done
          echo "バッテリー画像 $(ls public/bat | wc -l) 枚を生成"


          echo "--- 生成結果 ---"
          identify public/dash.png public/dash-land.png
          ls -lh public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
