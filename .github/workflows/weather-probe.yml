name: Weather probe

# 天気の取得元を変えるかどうかを決めるための、使い捨ての調査用ワークフロー。
# 判断がついたら消す。
#
# 確かめたいこと:
#   1. 気象庁の bosai JSON がランナーから取れるか
#      （日経の件で Stooq と Yahoo はランナーから弾かれた前例がある）
#   2. その中身の構造（非公式エンドポイントなので実物で確認する）
#   3. Open-Meteo の best_match と models=jma_seamless で予報が変わるか
#      → 変わるなら「気象庁モデルを指定していないこと」が食い違いの原因
#
# 結果は ::notice:: で出す。この環境からは Actions のログ本体が読めないが、
# アノテーションは gh api で読めるため。
#
# 座標は Secrets から渡す。気象庁側は府県コード 110000（埼玉県）を使う。
# 画面にはすでに「草加」が出ているので、県単位のコードで精度は増えない。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 気象庁 bosai が届くか / 中身は何か
        env:
          AREA: "110000"
        run: |
          set +e
          # 保存先の名前は URL から作らないこと。
          # 前回 basename を使ったら forecast/data/forecast と
          # overview_forecast/data/forecast がどちらも forecast.json になり、
          # 404 の HTML が本体を上書きして中身が読めなくなった。
          probe() {   # probe <保存名> <URL>
            code=$(curl -s -o "/tmp/$1.json" -w "%{http_code}" \
                   --max-time 25 -A "Mozilla/5.0" "$2")
            echo "::notice::JMA $1 → HTTP $code / $(wc -c < /tmp/$1.json) bytes"
          }
          probe forecast  "https://www.jma.go.jp/bosai/forecast/data/forecast/${AREA}.json"
          probe overview  "https://www.jma.go.jp/bosai/forecast/data/overview_forecast/${AREA}.json"
          # 地域の一覧も取る。草加がどの区域に入るかを確かめるため。
          curl -s -o /tmp/area.json --max-time 25 -A "Mozilla/5.0" \
            "https://www.jma.go.jp/bosai/common/const/area.json"
          echo "::notice::JMA area.json → $(wc -c < /tmp/area.json) bytes"

      - name: 天気コードの対応表を探す
        # 気象庁の weatherCode は独自（100/101/200/...）で、
        # index.html は WMO コード前提で描いている。変換表が要る。
        # **記憶で書かず、公式の表を取って作る。**
        run: |
          set +e
          # 表は const/*.json には無い（3候補とも 404）。
          # ページの JS に埋め込まれているので、そこから抜く。
          curl -s -o /tmp/page.html --max-time 25 -A "Mozilla/5.0" \
            "https://www.jma.go.jp/bosai/forecast/"
          echo "::notice::forecast ページ $(wc -c < /tmp/page.html) bytes"
          python3 - <<'PY'
          import re, json
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()

          # 表は HTML 本体の中に R.TELOPS={100:[...],101:[...]} の形である。
          # **キーが引用符なしの整数**なので、そのままでは JSON にならない。
          m = re.search(r'TELOPS\s*=\s*\{(.*?)\}\s*;', html, re.S)
          if not m:
              print("::notice::TELOPS が見つからない")
              raise SystemExit(0)
          body = m.group(1)
          print(f"::notice::TELOPS の塊 {len(body)}B")

          # 値は 5 要素: [昼svg, 夜svg, 代表コード, 和名, 英名]
          ent = re.findall(r'(\d+)\s*:\s*\[([^\]]*)\]', body)
          print(f"::notice::telop件数={len(ent)}")

          tbl = {}
          for code, vals in ent:
              parts = re.findall(r'"((?:[^"\\]|\\.)*)"', vals)
              parts = [p.encode().decode('unicode_escape')
                       .encode('latin1', 'ignore').decode('utf-8', 'ignore')
                       if '\\u' in p else p for p in parts]
              tbl[code] = parts

          print(f"::notice::例 100={tbl.get('100')} / 102={tbl.get('102')}")

          # 欲しいのは「コード → 代表コード」と、確認用の和名だけ
          pairs = [f"{c}:{v[2]}:{v[3]}" for c, v in
                   sorted(tbl.items(), key=lambda x: int(x[0])) if len(v) > 3]
          s = " ".join(pairs)
          print(f"::notice::全長={len(s)} 代表の種類={sorted({v[2] for v in tbl.values() if len(v)>2})}")
          for i in range(0, len(s), 820):
              print(f"::notice::TELOP[{i//820}] {s[i:i+820]}")
          PY

      - name: 気象庁の生データをそのまま出す
        run: |
          python3 - <<'PY'
          import json
          raw = open('/tmp/forecast.json', encoding='utf-8').read()
          s = json.dumps(json.loads(raw), ensure_ascii=False, separators=(',', ':'))
          print(f"::notice::raw 全長={len(s)}")
          for i in range(0, len(s), 850):
              print(f"::notice::RAW[{i//850}] {s[i:i+850]}")
          PY

      - name: 気象庁の中身を要約する
        run: |
          python3 - <<'PY'
          import json, os

          def note(s):
              s = str(s).replace('\n', ' ')[:900]
              print(f"::notice::{s}")

          try:
              d = json.load(open('/tmp/forecast.json', encoding='utf-8'))
          except Exception as e:
              note(f"forecast.json を読めない: {e}")
              raise SystemExit(0)

          note(f"要素数={len(d)}  発表={d[0].get('publishingOffice')} "
               f"{d[0].get('reportDatetime')}")

          for i, blk in enumerate(d):
              for j, ts in enumerate(blk.get('timeSeries', [])):
                  keys = sorted({k for a in ts['areas'] for k in a if k != 'area'})
                  names = [a['area']['name'] + ':' + a['area']['code']
                           for a in ts['areas']][:6]
                  note(f"[{i}][{j}] 時刻数={len(ts['timeDefines'])} "
                       f"項目={keys} 区域={names}")
                  note(f"[{i}][{j}] timeDefines={ts['timeDefines'][:4]}")

          # 埼玉県南部（草加が属する一次細分区域）を名前で探して中身を出す
          for i, blk in enumerate(d):
              for j, ts in enumerate(blk.get('timeSeries', [])):
                  for a in ts['areas']:
                      if '南部' in a['area']['name'] or '埼玉' in a['area']['name']:
                          vals = {k: v for k, v in a.items() if k != 'area'}
                          note(f"[{i}][{j}] {a['area']['name']}"
                               f"({a['area']['code']}) {vals}")
                          break

          tavg = d[1].get('tempAverage') if len(d) > 1 else None
          note(f"週間の平年値キーの有無: {bool(tavg)}")
          PY

      - name: Open-Meteo を best_match と jma_seamless で比べる
        env:
          DASH_LAT: ${{ secrets.DASH_LAT }}
          DASH_LON: ${{ secrets.DASH_LON }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          LAT = os.environ['DASH_LAT']; LON = os.environ['DASH_LON']

          def note(s):
              print(f"::notice::{str(s).replace(chr(10),' ')[:900]}")

          def get(models):
              u = ("https://api.open-meteo.com/v1/forecast"
                   f"?latitude={LAT}&longitude={LON}"
                   "&daily=weather_code,temperature_2m_max,temperature_2m_min,"
                   "precipitation_probability_max"
                   "&timezone=Asia%2FTokyo&forecast_days=8")
              if models:
                  u += f"&models={models}"
              with urllib.request.urlopen(u, timeout=30) as r:
                  return json.load(r)

          out = {}
          for name, m in (("best_match", None), ("jma_seamless", "jma_seamless")):
              try:
                  d = get(m)
                  dd = d['daily']
                  out[name] = dd
                  note(f"{name} 日付={dd['time'][:8]}")
                  note(f"{name} 天気={dd['weather_code'][:8]}")
                  note(f"{name} 最高={dd['temperature_2m_max'][:8]}")
                  note(f"{name} 最低={dd['temperature_2m_min'][:8]}")
                  note(f"{name} 降水={dd['precipitation_probability_max'][:8]}")
              except Exception as e:
                  note(f"{name} 失敗: {type(e).__name__} {e}")

          if len(out) == 2:
              a, b = out['best_match'], out['jma_seamless']
              diff = [i for i in range(min(len(a['time']), len(b['time'])))
                      if a['weather_code'][i] != b['weather_code'][i]]
              note(f"天気コードが違う日のindex={diff}")
              dt = [round((a['temperature_2m_max'][i] or 0)
                          - (b['temperature_2m_max'][i] or 0), 1)
                    for i in range(min(len(a['time']), len(b['time'])))]
              note(f"最高気温の差(best-jma)={dt}")
          PY
