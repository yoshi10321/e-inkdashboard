name: Weather probe

# 天気の取得元を変えるための調査。確認が済んだら消す。
#
# 済んだこと（2026-11-15）:
#   - 気象庁 bosai はランナーから取れる（HTTP 200）
#   - 応答の構造と天気コードの対応表（118件）を実物から取得
#   - Open-Meteo の best_match は気象庁と食い違う。
#     models=jma_seamless は降水確率を返さない（8日ぶん全部 None）
#   - 実装を本物に当てて、天気8日・降水確率8日の上書きを確認。気温は不変
#
# 残り: 草加がどの一次細分区域に入るか。
# アノテーションは 30 件が上限で、前回は後の段に押し出された。
# 確認済みの段は落として、残りだけにする。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 草加がどの予報区に入るか確かめる
        # 区域を取り違えると、黙って隣の地域の予報を出すことになる。
        # 埼玉県は 北部110020 / 南部110010 / 秩父地方110030 の3区域。
        # （草加という地名は画面にも CLAUDE.md にも既に出ているので、
        #   ここに書いても公開される情報は増えない）
        run: |
          curl -s -o /tmp/area.json --max-time 25 -A "Mozilla/5.0" \
            "https://www.jma.go.jp/bosai/common/const/area.json"
          python3 - <<'PY'
          import json
          a = json.load(open('/tmp/area.json', encoding='utf-8'))
          print(f"::notice::階層={list(a)}")

          hit = 0
          for code, v in (a.get('class20s') or {}).items():
              if '草加' in (v.get('name') or ''):
                  hit += 1
                  c15 = a['class15s'][v['parent']]
                  c10 = a['class10s'][c15['parent']]
                  print(f"::notice::★{v['name']}({code}) → "
                        f"{c15['name']}({c15['parent']}) → "
                        f"{c10['name']}({c15['parent'] and c15['parent']}) "
                        f"一次細分={c15['parent']} 府県={c10['parent']}")
          if not hit:
              print("::notice::class20s に見つからない。埼玉県の区域を並べる")
              for code, v in (a.get('class10s') or {}).items():
                  if code.startswith('11'):
                      print(f"::notice::class10s {code} {v.get('name')} "
                            f"親={v.get('parent')}")
          PY
